# dnsmasq main config — baked into image, override by mounting your own to /etc/dnsmasq.conf

# logging to stderr (captured by docker logs)
log-facility=-
log-queries=extra

# DNS basics
domain-needed
bogus-priv
no-resolv
no-poll
expand-hosts

# cache
cache-size=10000
neg-ttl=60

# default upstream(s) — written by entrypoint.sh from $DEFAULT_UPSTREAM
conf-file=/etc/dnsmasq.d/00-upstream.conf

# Complete GFW cache and user upstream rules are merged by reload.sh.
# The directory watcher regenerates this file; SIGHUP reloads it without restart.
servers-file=/etc/dnsmasq.d/servers.conf
